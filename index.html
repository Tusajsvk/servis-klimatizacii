// ---------- výpočty ----------
function metrics(d,I){
 const u=d.indoorUnits||[],n=Math.max(1,u.length),pre=+d.preChargedLen||0,ex=+d.extraChargeGPerM||20;
 const tot=u.reduce((s,x)=>s+(+x.pipeLength||0),0);
 const extra=u.reduce((s,x)=>s+Math.max(0,(+x.pipeLength||0)-pre/n)*ex,0);
 const kg=(+d.factoryChargeKg||0)+extra/1000;
 const co2=kg*(GWP[d.refrigerantType]||675)/1000;
 const ik=u.reduce((s,x)=>s+(+x.capacityKw||0),0);
 const ratio=+d.coolingCapacityKw>0?ik/d.coolingCapacityKw*100:0;
 const over=tot>(+d.maxTotalLen||60)||u.some(x=>+x.pipeLength>(+d.maxLenPerIndoor||25)||+x.heightDiff>(+d.maxHeightDiff||15));
 const last=I.filter(i=>i.deviceId===d.id&&i.status==='dokončená').sort((a,b)=>b.date.localeCompare(a.date))[0];
 const due=addM(last?last.date:d.commissioningDate,12);
 return{tot,extra,kg,co2,ik,ratio,over,due,overdue:due<today};
}

 const H=Math.max(200,u.length*80+40),oy=H/2,mx=+d.maxLenPerIndoor||25,mh=+d.maxHeightDiff||15;

 <defs><linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#0f766e"/><stop offset="100%" stopColor="#13202d"/></linearGradient></defs>

 ${u.map((x,i)=>{const y=40+i*80,bad=+x.pipeLength>mx||+x.heightDiff>mh,c=bad?'#f87171':'#2dd4bf';
  return h`<g key=${x.id}><line x1="180" y1=${oy} x2="440" y2=${y+28} stroke=${c} strokeWidth="3"/><rect x="440" y=${y} width="190" height="56" rx="10" fill="#1e293b" stroke=${c}/><text x="450" y=${y+22} fill="#fff" fontSize="13" fontWeight="700">${x.label||x.model}</text><text x="450" y=${y+42} fill="#94a3b8" fontSize="11">${x.capacityKw} kW · ${x.pipeLength} m · Δh ${x.heightDiff} m</text></g>`})}
 </svg>`};

function CustD({id,C,D,onSave,onDel,back,open}){
 const[c,setC]=useState(()=>C.find(x=>x.id===id)||newCust());
 const ex=C.some(x=>x.id===c.id),ds=D.filter(d=>d.customerId===c.id);
 const[ed,setEd]=useState(!ex),cancel=()=>{if(ex){setC(C.find(x=>x.id===id));setEd(false)}else back()};
 return h`<div><${Bar} title=${c.name||'Nový zákazník'} back=${back}/>
 <div class="card"><fieldset class="fs" disabled=${!ed}><${Form} fs=${CF} v=${c} set=${setC}/></fieldset>
  <div class="row" style="margin-top:10px">${ed?h`<button class="btn p np" onClick=${()=>c.name&&onSave(c)}>Uložiť</button><button class="btn np" onClick=${cancel}>Zrušiť</button>`:h`<button class="btn p np" onClick=${()=>setEd(true)}>✎ Upraviť</button>`}${ex&&!ed&&h`<${Del} on=${()=>onDel(c.id)}/>`}</div></div>
 ${ex&&h`<div class="card"><div class="row sp"><b>Zariadenia</b><button class="btn np" onClick=${()=>open('d',null,c.id)}>+ Zariadenie</button></div>
  ${ds.map(d=>h`<div key=${d.id} class="ck" style="cursor:pointer" onClick=${()=>open('d',d.id)}>${d.manufacturer} ${d.model} <span class="m">${d.serialNumber}</span></div>`)}</div>`}</div>`}

function DevD({id,extra,C,D,I,S,onSave,onDel,back,open}){
 const[d,setD]=useState(()=>D.find(x=>x.id===id)||newDev(extra));
 const ex=D.some(x=>x.id===d.id),m=metrics(d,I);
 const[ed,setEd]=useState(!ex),cancel=()=>{if(ex){setD(D.find(x=>x.id===id));setEd(false)}else back()};
 const co=[['','— vyberte zákazníka —'],...C.map(c=>[c.id,c.name])];
 const setU=(i,u)=>setD({...d,indoorUnits:d.indoorUnits.map((x,j)=>j===i?u:x)});
 const insps=I.filter(i=>i.deviceId===d.id).sort((a,b)=>b.date.localeCompare(a.date));
 const rOut=m.ratio&&(m.ratio<S.capacityRatioMin||m.ratio>S.capacityRatioMax);
 return h`<div><${Bar} title=${(d.manufacturer+' '+d.model).trim()||'Nové zariadenie'} back=${back}/>
 <div class="card"><fieldset class="fs" disabled=${!ed}><div class="g"><${F} f=${['customerId','Zákazník','select',co]} v=${d} set=${setD}/></div><div style="height:10px"></div><${Form} fs=${DF} v=${d} set=${setD}/></fieldset></div>
 <div class="card"><div class="row sp"><b>Vnútorné jednotky</b>${ed&&h`<button class="btn np" onClick=${()=>setD({...d,indoorUnits:[...d.indoorUnits,{id:uid('ind_'),type:d.systemType==='kanálová'?'kanálová':'nástenná',label:'',model:'',capacityKw:'',pipeLength:'',heightDiff:'',port:''}]})}>+ Jednotka</button>`}</div>
 ${d.indoorUnits.map((u,i)=>h`<div key=${u.id} style="margin-top:10px;padding-top:10px;border-top:1px solid var(--b)"><div class="row" style="margin-bottom:8px"><${Mini} t=${u.type||(d.systemType==='kanálová'?'kanálová':'nástenná')}/><b>${u.label||u.model||'Jednotka '+(i+1)}</b></div><fieldset class="fs" disabled=${!ed}><${Form} fs=${UF} v=${u} set=${x=>setU(i,x)}/></fieldset>${ed&&h`<button class="btn d np" style="margin-top:6px" onClick=${()=>setD({...d,indoorUnits:d.indoorUnits.filter((_,j)=>j!==i)})}>Odstrániť jednotku</button>`}</div>`)}</div>
 <div class="card"><b>Výpočty a kontrola</b>
  <div class="row" style="margin-top:6px"><span class="bd">Potrubie spolu ${fn(m.tot)} m</span><span class="bd">Náplň ${fn(m.kg)} kg (+${fn(m.extra)} g)</span><span class="bd">CO₂ ekv. ${fn(m.co2)} t</span><span class=${'bd '+(rOut?'w':'')}>Pomer výkonu ${fn(m.ratio)} %</span>
  ${m.over&&h`<span class="bd d">⚠ Prekročené limity potrubia</span>`}<span class=${'bd '+(m.overdue?'d':'ok')}>Kontrola úniku do ${fd(m.due)}${m.overdue?' – po termíne':''}</span></div></div>
 <${Dia} d=${d}/>
 <div class="row np" style="margin:10px 0">${ed?h`<button class="btn p" onClick=${()=>d.customerId&&onSave(d)}>Uložiť zariadenie</button><button class="btn" onClick=${cancel}>Zrušiť</button>`:h`<button class="btn p" onClick=${()=>setEd(true)}>✎ Upraviť</button>`}${ex&&h`<button class="btn" onClick=${()=>open('i',null,d.id)}>+ Nová revízia</button>`}${ex&&!ed&&h`<${Del} on=${()=>onDel(d.id)}/>`}</div>
 ${!d.customerId&&h`<div class="w np">Pred uložením vyberte zákazníka.</div>`}
 ${insps.length>0&&h`<div class="card"><b>História revízií</b>${insps.map(i=>h`<div key=${i.id} class="ck" style="cursor:pointer" onClick=${()=>open('i',i.id)}>${fd(i.date)} · ${i.type}${uname(d,i)} <span class=${'bd '+(i.status==='dokončená'?'ok':'w')}>${i.status}</span></div>`)}</div>`}</div>`}

function InspD({id,extra,C,D,I,S,onSave,onDel,back}){
 const[o,setO]=useState(()=>I.find(x=>x.id===id)||newInsp(extra,S));
 const ex=I.some(x=>x.id===o.id),dev=D.find(x=>x.id===o.deviceId),cu=dev&&C.find(c=>c.id===dev.customerId);
 const its=[...(o.useA?items('A'):[]),...(o.useB?items('B'):[])],ck=o.checklistData||{};
 const setK=(k,p)=>setO({...o,checklistData:{...ck,[k]:{...ck[k],...p}}});
 const setP=(i,p)=>setO({...o,parts:o.parts.map((x,j)=>j===i?{...x,...p}:x)});
 const us=(dev&&dev.indoorUnits)||[],mu=us.length>1||(dev&&(dev.systemType==='multisplit'||dev.systemType==='VRF')),uo=[['','Všetky / celý systém'],...us.map(u=>[u.id,(u.label||u.model||'Jednotka')+(u.port?' (port '+u.port+')':'')])],un=us.find(u=>u.id===o.indoorUnitId)||{};
 const probs=its.filter(i=>(ck[i.id]||{}).problem).length,done=its.filter(i=>(ck[i.id]||{}).checked).length;
 const sum=o.parts.reduce((s,p)=>s+(+p.qty||0)*(+p.unitPrice||0),0);
 const[msg,setMsg]=useState(''),[pm,setPm]=useState(false);
 const dl=async()=>{try{const d=window.claude?await window.claude.use('downloads'):null;if(!d){setMsg('Sťahovanie tu nie je dostupné.');return}await d.save({filename:'protokol-'+o.date+'.html',data:protoHtml(o,dev,cu,S,its,ck,sum)});setMsg('Súbor je uložený – otvorte ho a v okne tlače zvoľte tlačiareň alebo PDF.')}catch(e){setMsg(e&&e.code==='declined'?'':'Uloženie sa nepodarilo.')}};
 const IF=[['date','Dátum','date'],['technician','Technik'],['status','Stav','select',['rozpracovaná','dokončená']],['reportedSymptom','Nahlásený problém'],['errorCode','Chybový kód'],['nextInspectionDate','Ďalšia revízia','date'],['useA','Šablóna A – profilaktika','check'],['useB','Šablóna B – diagnostika','check']];
 const dv=[['','— vyberte zariadenie —'],...D.map(d=>[d.id,((C.find(c=>c.id===d.customerId)||{}).name||'')+' – '+d.manufacturer+' '+d.model])];
 let last='';
 return h`<div><${Bar} title=${'Servisný protokol'} back=${back}/>
 <div class="card"><b>${S.companyName}</b><div class="m">${S.companyAddress} · IČO ${S.companyIco} · DIČ ${S.companyDic} · ${S.companyPhone}</div>
  <div style="margin-top:6px">Protokol zo dňa <b>${fd(o.date)}</b> · technik ${o.technician} (cert. ${S.technicianCert})</div>
  ${dev&&h`<div>${cu&&cu.name} — ${dev.manufacturer} ${dev.model}, s/n ${dev.serialNumber}, ${dev.refrigerantType}</div>`}${un.id&&h`<div>Vnútorná jednotka: <b>${un.label||un.model}</b> (${un.type||'nástenná'}${un.port?', port '+un.port:''})</div>`}</div>
 <div class="card"><div class="g"><${F} f=${['deviceId','Zariadenie','select',dv]} v=${o} set=${setO}/>${mu&&h`<${F} f=${['indoorUnitId','Vnútorná jednotka','select',uo]} v=${o} set=${setO}/>`}</div><div class="sec" style="margin:12px 0 6px">Druh zásahu</div><div class="g">${TY.map(([t,n,c,k])=>h`<div key=${t} class=${'ty'+(o.type===t?' on':'')} style=${{'--c2':c}} onClick=${()=>setO({...o,type:t})}><div class="ic"><${Icon} k=${k} n=${22}/></div><div><b>${t}</b><small>${n}</small></div></div>`)}</div><div style="height:10px"></div><${Form} fs=${IF} v=${o} set=${setO}/></div>
 <div class="card"><div class="row sp"><b>Kontrolný zoznam</b><span class="bd">${done}/${its.length} hotovo${probs?' · ⚠ '+probs:''}</span></div>
 ${its.filter(i=>!pm||(ck[i.id]||{}).checked).map(i=>{const e=ck[i.id]||{},hd=i.sec!==last;last=i.sec;
  return h`<div key=${i.id}>${hd&&h`<div class="sec">${i.sec}</div>`}<div class="ck"><input type="checkbox" checked=${!!e.checked} onChange=${x=>setK(i.id,{checked:x.target.checked})}/><span style="flex:1">${i.label}</span>
  ${i.unit&&h`<input style="width:84px" type="number" step="any" placeholder=${i.unit} value=${e.value||''} onChange=${x=>setK(i.id,{value:x.target.value})}/>`}
  <button class=${'btn np'+(e.problem?' d':'')} title="Problém" onClick=${()=>setK(i.id,{problem:!e.problem})}><${Icon} k="w" n=${18}/></button></div>${pm?(e.note&&h`<div class="m" style="padding:2px 0 6px">Poznámka: ${e.note}</div>`):((e.problem||e.note)&&h`<input placeholder="Poznámka k položke…" value=${e.note||''} onChange=${x=>setK(i.id,{note:x.target.value})} style="margin:2px 0 6px"/>`)}</div>`})}</div>
 <div class="card"><b>Merania</b><div style="height:8px"></div><${Form} fs=${MF} v=${o.measurements} set=${m=>setO({...o,measurements:m})}/></div>
 <div class="card"><div class="row sp"><b>Použitý materiál</b><button class="btn np" onClick=${()=>setO({...o,parts:[...o.parts,{id:uid('p_'),name:'',qty:1,unitPrice:0}]})}>+ Položka</button></div>
 ${o.parts.map((p,i)=>h`<div key=${p.id} class="row" style="margin-top:6px"><input style="flex:3;min-width:140px" placeholder="Položka" value=${p.name} onChange=${e=>setP(i,{name:e.target.value})}/><input style="width:70px" type="number" placeholder="ks" value=${p.qty} onChange=${e=>setP(i,{qty:e.target.value})}/><input style="width:90px" type="number" step="any" placeholder="€/ks" value=${p.unitPrice} onChange=${e=>setP(i,{unitPrice:e.target.value})}/><button class="btn d np" onClick=${()=>setO({...o,parts:o.parts.filter((_,j)=>j!==i)})}>✕</button></div>`)}
 <div style="margin-top:8px"><b>Spolu: ${fn(sum)} €</b> <span class="m">(bez DPH)</span></div></div>
 <div class="card"><${F} f=${['recommendations','Odporúčania / záver','area']} v=${o} set=${setO}/></div>
 <div class="row np"><button class="btn p" onClick=${()=>o.deviceId&&onSave(o)}>Uložiť</button><button class="btn" onClick=${()=>{setPm(true);setTimeout(()=>{try{window.print()}catch(e){}setTimeout(()=>setPm(false),1500)},350);setMsg(window.claude?'Ak sa okno tlače neotvorí, použite Stiahnuť protokol.':'')}}><${Icon} k="r" n=${16}/> Tlačiť</button>${window.claude&&h`<button class="btn" onClick=${dl}><${Icon} k="g" n=${16}/> Stiahnuť protokol</button>`}${msg&&h`<span class="m np" style="flex-basis:100%;order:9">${msg}</span>`}${ex&&h`<${Del} on=${()=>onDel(o.id)}/>`}</div>
 ${!o.deviceId&&h`<div class="w np" style="margin-top:6px">Pred uložením vyberte zariadenie.</div>`}</div>`}

const TY=[['Ročná profilaktika','Pravidelná servisná prehliadka','#0d9488','i'],['Diagnostika poruchy','Hľadanie príčiny závady','#e11d48','w'],['Oprava','Výmena dielov, odstránenie závady','#f59e0b','t'],['Inštalácia','Nové zariadenie, uvedenie do chodu','#6366f1','p']];
const uname=(d,i)=>{const u=d&&(d.indoorUnits||[]).find(x=>x.id===i.indoorUnitId);return u?' · '+(u.label||u.model):''};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function protoHtml(o,dev,cu,S,its,ck,sum){
 let last='';
 const rows=its.filter(i=>(ck[i.id]||{}).checked).map(i=>{const e=ck[i.id]||{},hd=i.sec!==last?'<tr><th colspan="3">'+esc(i.sec)+'</th></tr>':'';last=i.sec;return hd+'<tr><td>'+(e.problem?'⚠':e.checked?'✓':'–')+'</td><td>'+esc(i.label)+(e.note?'<br><i>'+esc(e.note)+'</i>':'')+'</td><td>'+(e.value?esc(e.value)+' '+(i.unit||''):'')+'</td></tr>'}).join('');
 const ms=MF.filter(f=>o.measurements[f[0]]).map(f=>esc(f[1])+': <b>'+esc(o.measurements[f[0]])+'</b>').join(' · ');
 const un=((dev&&dev.indoorUnits)||[]).find(u=>u.id===o.indoorUnitId);
 const ps=o.parts.map(p=>'<tr><td colspan="2">'+esc(p.name)+'</td><td>'+esc(p.qty)+' × '+fn(p.unitPrice)+' €</td></tr>').join('');
 return '<!DOCTYPE html><html lang="sk"><head><meta charset="utf-8"><title>Servisný protokol</title><style>body{font:13px system-ui,sans-serif;max-width:780px;margin:20px auto;padding:0 16px;color:#111}table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left}th{background:#e3f2ef}h1{font-size:20px;margin:0}.sg{display:flex;gap:40px;margin-top:60px}.sg div{flex:1;border-top:1px solid #000;padding-top:4px}</style></head><body onload="setTimeout(print,400)"><h1>Servisný protokol</h1><p><b>'+esc(S.companyName)+'</b><br>'+esc(S.companyAddress)+' · IČO '+esc(S.companyIco)+' · '+esc(S.companyPhone)+'</p><p>Dátum: <b>'+fd(o.date)+'</b> · Druh: <b>'+esc(o.type)+'</b><br>Technik: '+esc(o.technician)+' (cert. '+esc(S.technicianCert)+')<br>Zákazník: '+esc(cu&&cu.name)+'<br>Zariadenie: '+esc(dev&&dev.manufacturer+' '+dev.model)+', s/n '+esc(dev&&dev.serialNumber)+', '+esc(dev&&dev.refrigerantType)+(un?'<br>Vnútorná jednotka: <b>'+esc(un.label||un.model)+'</b> ('+esc(un.type||'nástenná')+(un.port?', port '+esc(un.port):'')+')':'')+'</p>'+(o.reportedSymptom?'<p>Nahlásený problém: '+esc(o.reportedSymptom)+(o.errorCode?' (kód '+esc(o.errorCode)+')':'')+'</p>':'')+'<table>'+rows+'</table>'+(ms?'<p>'+ms+'</p>':'')+(ps?'<table>'+ps+'</table><p><b>Spolu: '+fn(sum)+' € bez DPH</b></p>':'')+'<p>Odporúčania: '+esc(o.recommendations)+'</p><p>Ďalšia revízia: <b>'+fd(o.nextInspectionDate)+'</b></p><div class="sg"><div>Podpis technika</div><div>Podpis zákazníka</div></div></body></html>'}
const UG={out:'<rect x="0" y="0" width="130" height="100" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><circle cx="65" cy="50" r="36" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><path d="M65 50V20M65 50l26 15M65 50l-26 15" stroke="#475569" stroke-width="4" stroke-linecap="round"/><circle cx="65" cy="50" r="6" fill="#475569"/><path d="M12 14h8M12 22h8M12 30h8M12 38h8" stroke="#94a3b8" stroke-width="2"/><rect x="14" y="100" width="22" height="6" fill="#64748b"/><rect x="94" y="100" width="22" height="6" fill="#64748b"/>',
'nástenná':'<rect x="0" y="4" width="120" height="36" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><rect x="8" y="29" width="104" height="6" rx="3" fill="#cbd5e1"/><circle cx="104" cy="15" r="3" fill="#2dd4bf"/>',
'kanálová':'<path d="M0 16h8M0 32h8M112 16h8M112 32h8" stroke="#64748b" stroke-width="2"/><rect x="8" y="6" width="104" height="36" rx="4" fill="#cbd5e1" stroke="#64748b"/><rect x="14" y="12" width="92" height="24" rx="2" fill="#94a3b8" opacity=".5"/><path d="M30 18v12M45 18v12M60 18v12M75 18v12M90 18v12" stroke="#475569"/>',

const Dia=({d})=>{const u=d.indoorUnits||[],n=Math.max(1,u.length),H=Math.max(230,n*84+70),oy=H/2,mx=+d.maxLenPerIndoor||25,mh=+d.maxHeightDiff||15,dt=d.systemType==='kanálová'?'kanálová':'nástenná';
 return h`<svg viewBox=${'0 0 680 '+H} style="width:100%;height:auto;background:#0f172a;border-radius:20px">
 <text x="20" y="24" fill="#94a3b8" fontSize="12">Náhľad · ${d.systemType} · ${d.refrigerantType}</text>
 <g transform=${'translate(24 '+(oy-53)+')'} dangerouslySetInnerHTML=${{__html:UG.out}}/>
 <text x="89" y=${oy+76} fill="#99f6e4" fontSize="12" textAnchor="middle">Vonkajšia jednotka</text>
 ${u.map((x,i)=>{const y=40+i*84,yc=y+24,t=x.type||dt,e=260+(t==='kazetová'?30:0),bad=+x.pipeLength>mx||+x.heightDiff>mh,gc=bad?'#f87171':'#38bdf8',lc=bad?'#fca5a5':'#fb923c';
 return h`<g key=${x.id}><path d=${'M154 '+(oy-8)+'H185V'+(yc-5)+'H'+e} fill="none" stroke=${gc} strokeWidth="3"/><path d=${'M154 '+(oy+8)+'H205V'+(yc+5)+'H'+e} fill="none" stroke=${lc} strokeWidth="2"/>
 <g transform=${'translate(260 '+y+')'} dangerouslySetInnerHTML=${{__html:UG[t]||UG['nástenná']}}/>
 <text x="395" y=${y+16} fill="#fff" fontSize="13" fontWeight="700">${x.label||x.model||'Jednotka'}</text>
 <text x="395" y=${y+33} fill="#94a3b8" fontSize="11">${t} · ${x.capacityKw||0} kW</text>
 <text x="395" y=${y+49} fill=${bad?'#f87171':'#94a3b8'} fontSize="11">${x.pipeLength||0} m · Δh ${x.heightDiff||0} m${bad?' ⚠':''}</text></g>`})}
 ${!u.length&&h`<g><path d=${'M154 '+(oy-8)+'H260'} fill="none" stroke="#38bdf8" strokeWidth="3" strokeDasharray="6 5"/><path d=${'M154 '+(oy+8)+'H260'} fill="none" stroke="#fb923c" strokeWidth="2" strokeDasharray="6 5"/><g transform=${'translate(260 '+(oy-24)+')'} opacity=".45" dangerouslySetInnerHTML=${{__html:UG[dt]}}/><text x="395" y=${oy-2} fill="#94a3b8" fontSize="13">Pridajte vnútornú jednotku</text><text x="395" y=${oy+16} fill="#64748b" fontSize="11">(${dt})</text></g>`}
 <text x="20" y=${H-12} fill="#38bdf8" fontSize="11">━ plyn</text><text x="75" y=${H-12} fill="#fb923c" fontSize="11">━ kvapalina</text>
 </svg>`};
// ---------- aplikácia ----------
function App({lock}){
 const[S,setS]=useLS('ks_s',SET0),[C,setC]=useLS('ks_c',CUST0),[D,setD]=useLS('ks_d',DEV0),[I,setI]=useLS('ks_i',INSP0);
 const[tab,setTab]=useState('c'),[v,setV]=useState(null),[q,setQ]=useState('');
 const open=(t,id,extra)=>{setV({t,id,extra});window.scrollTo(0,0)},back=()=>setV(null);
 const dn=d=>d?d.manufacturer+' '+d.model:'—',cn=id=>(C.find(c=>c.id===id)||{}).name||'—';
 const has=(...a)=>a.join(' ').toLowerCase().includes(q.toLowerCase());
 const delC=id=>{const ds=D.filter(d=>d.customerId===id).map(d=>d.id);setI(l=>l.filter(i=>!ds.includes(i.deviceId)));setD(l=>l.filter(d=>d.customerId!==id));rm(setC,id);back()};
 const delD=id=>{setI(l=>l.filter(i=>i.deviceId!==id));rm(setD,id);back()};
 const saveI=o=>{up(setI,o);if(o.status==='dokončená'&&o.nextInspectionDate)setD(l=>l.map(d=>d.id===o.deviceId?{...d,nextInspectionDate:o.nextInspectionDate}:d));back()};
 const P={C,D,I,S,back,open};
 let body;
 if(v&&v.t==='c')body=h`<${CustD} key=${'c'+v.id} id=${v.id} ...${P} onSave=${o=>{up(setC,o);back()}} onDel=${delC}/>`;
 else if(v&&v.t==='d')body=h`<${DevD} key=${'d'+v.id} id=${v.id} extra=${v.extra} ...${P} onSave=${o=>{up(setD,o);back()}} onDel=${delD}/>`;
 else if(v&&v.t==='i')body=h`<${InspD} key=${'i'+v.id} id=${v.id} extra=${v.extra} ...${P} onSave=${saveI} onDel=${id=>{rm(setI,id);back()}}/>`;
 else if(tab==='c')body=h`<div><div class="row sp"><input style="flex:1" placeholder="Hľadať zákazníka…" value=${q} onChange=${e=>setQ(e.target.value)}/><button class="btn p" onClick=${()=>open('c',null)}>+ Zákazník</button></div>
  ${C.filter(c=>has(c.name,c.phone,c.email,c.contactPerson)).map(c=>h`<div key=${c.id} class="card li" onClick=${()=>open('c',c.id)}><div class="tile k-c"><${Icon} k="c" n=${22}/></div><b>${c.name}</b> <span class="bd m">${c.type==='firma'?'firma':'FO'}</span><div class="m">${c.contactPerson} · ${c.phone} · ${c.email}</div><div class="m">Zariadení: ${D.filter(d=>d.customerId===c.id).length}</div></div>`)}</div>`;
 else if(tab==='d')body=h`<div><div class="row sp"><input style="flex:1" placeholder="Hľadať zariadenie…" value=${q} onChange=${e=>setQ(e.target.value)}/><button class="btn p" onClick=${()=>open('d',null)}>+ Zariadenie</button></div>
  ${D.filter(d=>has(d.manufacturer,d.model,d.serialNumber,cn(d.customerId))).map(d=>{const m=metrics(d,I);return h`<div key=${d.id} class="card li" onClick=${()=>open('d',d.id)}><div class="tile k-d"><${Icon} k="d" n=${22}/></div><b>${dn(d)}</b> <span class="m">${d.serialNumber}</span><div class="m">${cn(d.customerId)} · ${d.refrigerantType} · ${fn(d.coolingCapacityKw)} kW</div><div class="row" style="margin:6px 0 2px">${(d.indoorUnits||[]).slice(0,4).map(u=>h`<${Mini} key=${u.id} w=${48} t=${u.type||(d.systemType==='kanálová'?'kanálová':'nástenná')}/>`)}</div>
   <span class="bd">Ďalšia revízia ${fd(d.nextInspectionDate)}</span>${m.over&&h`<span class="bd d">⚠ limity</span>`}${m.overdue&&h`<span class="bd d">Kontrola úniku po termíne</span>`}</div>`})}</div>`;
 else if(tab==='i')body=h`<div><div class="row sp"><input style="flex:1" placeholder="Hľadať revíziu…" value=${q} onChange=${e=>setQ(e.target.value)}/><button class="btn p" disabled=${!D.length} onClick=${()=>open('i',null,D[0]&&D[0].id)}>+ Revízia</button></div>
  ${[...I].sort((a,b)=>b.date.localeCompare(a.date)).filter(i=>has(i.type,dn(D.find(d=>d.id===i.deviceId)),i.date)).map(i=>{const dv=D.find(d=>d.id===i.deviceId);return h`<div key=${i.id} class="card li" onClick=${()=>open('i',i.id)}><div class="tile k-i"><${Icon} k="i" n=${22}/></div><b>${i.type}</b> <span class=${'bd '+(i.status==='dokončená'?'ok':'w')}>${i.status}</span><div class="m">${fd(i.date)} · ${dn(dv)} · ${dv&&cn(dv.customerId)}${uname(dv,i)}</div></div>`})}</div>`;
 else body=h`<div><div class="card"><${Form} fs=${SF} v=${S} set=${setS}/></div>
  <button class="btn" onClick=${lock}><${Icon} k="l" n=${16}/> Zamknúť aplikáciu</button> <button class="btn d" onClick=${()=>{setS(SET0);setC(CUST0);setD(DEV0);setI(INSP0)}}>Obnoviť ukážkové dáta</button><div class="m" style="margin-top:8px">Dáta sa ukladajú v tomto prehliadači.</div></div>`;
 const nav=[['c','Zákazníci'],['d','Zariadenia'],['i','Revízie'],['s','Nastavenia']];
 return h`<div><div class="hero np"><div class="lg"><${Icon} k="f" n=${26}/></div><div><b>${S.companyName}</b><small>Evidencia servisu klimatizácií</small></div></div>
 <div style="margin-top:10px">${body}</div><div class="tabs np">${nav.map(([k,l])=>h`<button key=${k} class=${'k-'+k+((v?v.t:tab)===k?' on':'')} onClick=${()=>{setTab(k);setV(null);setQ('')}}><span class="ti"><${Icon} k=${k} n=${20}/></span>${l}</button>`)}</div></div>`}

const H1='e077da6b762bc3409ddfb08a53030f4be75ec24c53622422c0a08fafeadb5c7b',H2='4387409837386626';
const c53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)};
const chk=async p=>{try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===H1}}catch(e){}return String(c53(p))===H2};
Object.assign(IC,{l:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'});
function Lock({children}){
 const[ok,setOk]=useState(()=>{try{return sessionStorage.getItem('ks_ok')==='1'}catch(e){return false}});
 const[p,setP]=useState(''),[err,setErr]=useState(false);
 const go=async()=>{if(await chk(p)){try{sessionStorage.setItem('ks_ok','1')}catch(e){}setP('');setOk(true)}else setErr(true)};
 const lock=()=>{try{sessionStorage.removeItem('ks_ok')}catch(e){}setOk(false)};
 if(ok)return children(lock);
 return h`<div class="lock"><div class="lockc"><div class="lk"><${Icon} k="l" n=${32}/></div><b style="font-size:19px">Aplikácia je zamknutá</b><span class="m">Zadajte heslo</span><input type="password" autoFocus placeholder="Heslo" value=${p} onChange=${e=>{setP(e.target.value);setErr(false)}} onKeyDown=${e=>e.key==='Enter'&&go()}/>${err&&h`<div class="d">Nesprávne heslo</div>`}<button class="btn p" onClick=${go}>Odomknúť</button></div></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${Lock}>${lock=>h`<${App} lock=${lock}/>`}<//>`);
</script>
